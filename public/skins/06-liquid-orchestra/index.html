<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#babaf6">
  <title>Liquid Orchestra — Self-Driving Jazz</title>
  <meta name="description" content="Self-Driving Jazz: a liquid orchestra in a surreal, optimistic sound world.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,400..800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --sky-high: #9499e9;
      --sky-low: #f2b9b4;
      --haze: #f8d4b8;
      --sand-high: #f4c985;
      --sand-low: #c4785b;
      --sand-shadow: #9c5d58;
      --ink: #151739;
      --ink-soft: #3f4168;
      --paper: #fff7e5;
      --white-glint: #fffdf3;
      --blue: #1b44d8;
      --blue-deep: #18298d;
      --blue-light: #85c9ff;
      --aqua: #86e5e7;
      --peach: #ffb48f;
      --rose: #e27b9a;
      --chrome-dark: #313b72;
      --chrome-mid: #9a9ee0;
      --chrome-light: #fbe8dc;
      --status: #174db6;
      --font-display: "Bricolage Grotesque", "Arial Narrow", Arial, sans-serif;
      --font-mono: "DM Mono", "Courier New", monospace;
      --space-1: 0.25rem;
      --space-2: 0.5rem;
      --space-3: 0.75rem;
      --space-4: 1rem;
      --space-6: 1.5rem;
      --space-8: 2rem;
      --space-12: 3rem;
      --space-16: 4rem;
      --line: 1px;
      --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-width: 0;
      min-height: 100%;
      margin: 0;
    }

    body {
      overflow: hidden;
      color: var(--ink);
      background: var(--sky-low);
      font-family: var(--font-display);
      font-synthesis: none;
    }

    .page {
      position: relative;
      isolation: isolate;
      width: 100%;
      min-height: 100svh;
      overflow: hidden;
    }

    .scene {
      position: absolute;
      z-index: -2;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
    }

    .scene::after {
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, rgb(255 247 229 / 0.06), transparent 34%, rgb(21 23 57 / 0.08));
      content: "";
    }

    #dreamscape {
      display: block;
      width: 100%;
      height: 100%;
    }

    .topline {
      position: absolute;
      z-index: 5;
      top: 0;
      left: 0;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      width: 100%;
      padding: var(--space-6) clamp(var(--space-4), 3.2vw, var(--space-12));
      font-family: var(--font-mono);
      font-size: 0.68rem;
      letter-spacing: 0.08em;
      line-height: 1.35;
      text-transform: uppercase;
    }

    .edition {
      display: flex;
      align-items: center;
      gap: var(--space-3);
      margin: 0;
    }

    .mark {
      position: relative;
      width: var(--space-8);
      height: var(--space-8);
      flex: 0 0 auto;
      border: var(--line) solid currentColor;
      border-radius: 50%;
    }

    .mark::before,
    .mark::after {
      position: absolute;
      border-radius: 50%;
      content: "";
    }

    .mark::before {
      inset: var(--space-1);
      border: var(--line) solid currentColor;
      border-left-color: transparent;
      transform: rotate(-28deg);
    }

    .mark::after {
      top: 50%;
      left: 50%;
      width: var(--space-1);
      height: var(--space-1);
      background: currentColor;
      transform: translate(-50%, -50%);
    }

    .edition span {
      display: block;
      color: var(--ink-soft);
    }

    .status {
      display: flex;
      align-items: center;
      gap: var(--space-2);
      margin: var(--space-2) 0 0;
      text-align: right;
    }

    .status::before {
      width: var(--space-2);
      height: var(--space-2);
      flex: 0 0 auto;
      border-radius: 50%;
      background: var(--status);
      box-shadow: 0 0 0 var(--space-1) rgb(23 77 182 / 0.15);
      content: "";
      animation: breathe 3.4s var(--ease-out) infinite alternate;
    }

    .hero {
      position: relative;
      z-index: 2;
      display: grid;
      grid-template-columns: minmax(0, 1.55fr) minmax(16rem, 0.45fr);
      align-items: end;
      gap: clamp(var(--space-6), 4vw, var(--space-16));
      min-height: 100svh;
      padding: clamp(var(--space-16), 11vh, 7rem) clamp(var(--space-4), 3.2vw, var(--space-12)) clamp(var(--space-6), 4.2vh, var(--space-12));
    }

    .title-block {
      min-width: 0;
    }

    .kicker {
      display: flex;
      align-items: center;
      gap: var(--space-3);
      margin: 0 0 var(--space-4);
      font-family: var(--font-mono);
      font-size: 0.66rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .kicker::before {
      width: var(--space-8);
      height: var(--line);
      background: currentColor;
      content: "";
    }

    h1 {
      width: min-content;
      margin: 0;
      color: var(--ink);
      font-size: clamp(5.3rem, min(13vw, 22vh), 13rem);
      font-stretch: 75%;
      font-weight: 800;
      letter-spacing: -0.075em;
      line-height: 0.69;
      text-transform: uppercase;
    }

    h1 span {
      display: block;
      width: max-content;
    }

    h1 span:nth-child(2) {
      margin-left: 0.34em;
      color: transparent;
      -webkit-text-stroke: clamp(1px, 0.12vw, 2px) var(--ink);
    }

    h1 span:nth-child(3) {
      margin-left: 0.94em;
      color: var(--paper);
      text-shadow: 0.025em 0.035em 0 var(--blue-deep);
    }

    .introduction {
      align-self: end;
      max-width: 25rem;
      padding: var(--space-4) 0 0;
      border-top: var(--line) solid rgb(21 23 57 / 0.5);
    }

    .intro-label {
      display: flex;
      justify-content: space-between;
      gap: var(--space-4);
      margin: 0 0 var(--space-4);
      font-family: var(--font-mono);
      font-size: 0.64rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .intro-label span:last-child {
      color: var(--ink-soft);
    }

    .introduction > p:last-child {
      margin: 0;
      font-size: clamp(0.9rem, 1.15vw, 1.08rem);
      font-weight: 500;
      letter-spacing: -0.015em;
      line-height: 1.45;
    }

    .bubble-cluster {
      animation: float 7s var(--ease-out) infinite alternate;
      transform-box: fill-box;
      transform-origin: center;
    }

    .orbit {
      animation: orbit 11s linear infinite;
      transform-box: fill-box;
      transform-origin: center;
    }

    .snake-shine {
      animation: current 8s linear infinite;
    }

    @keyframes float {
      to {
        transform: translateY(-1rem) rotate(1.5deg);
      }
    }

    @keyframes orbit {
      to {
        transform: rotate(360deg);
      }
    }

    @keyframes current {
      to {
        stroke-dashoffset: -12rem;
      }
    }

    @keyframes breathe {
      to {
        opacity: 0.38;
        transform: scale(0.78);
      }
    }

    @media (max-width: 760px) {
      body {
        overflow-y: auto;
      }

      .page,
      .hero {
        min-height: max(100svh, 48rem);
      }

      #dreamscape {
        position: relative;
        left: -38%;
        width: 176%;
        max-width: none;
      }

      .topline {
        padding: var(--space-4);
      }

      .edition span {
        display: none;
      }

      .status {
        max-width: 15ch;
      }

      .hero {
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
        gap: var(--space-6);
        padding: 15rem var(--space-4) var(--space-6);
      }

      .title-block,
      .introduction {
        width: 100%;
      }

      .kicker {
        margin-bottom: var(--space-3);
      }

      h1 {
        font-size: clamp(3.5rem, 18.5vw, 6rem);
        line-height: 0.72;
      }

      h1 span:nth-child(2) {
        margin-left: 0.16em;
      }

      h1 span:nth-child(3) {
        margin-left: 0.62em;
      }

      .introduction {
        max-width: none;
        padding-top: var(--space-3);
      }

      .intro-label {
        margin-bottom: var(--space-3);
      }
    }

    @media (max-width: 360px) {
      .status {
        font-size: 0.6rem;
      }

      .hero {
        padding-right: var(--space-3);
        padding-left: var(--space-3);
      }

      h1 {
        font-size: 18vw;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        animation-duration: 0.001ms !important;
        animation-iteration-count: 1 !important;
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="scene" aria-hidden="true">
      <svg id="dreamscape" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="var(--sky-high)"/>
            <stop offset="0.55" stop-color="var(--sky-low)"/>
            <stop offset="1" stop-color="var(--haze)"/>
          </linearGradient>
          <linearGradient id="sand" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="var(--sand-high)"/>
            <stop offset="1" stop-color="var(--sand-low)"/>
          </linearGradient>
          <linearGradient id="dune" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="var(--haze)"/>
            <stop offset="0.55" stop-color="var(--sand-high)"/>
            <stop offset="1" stop-color="var(--sand-shadow)"/>
          </linearGradient>
          <linearGradient id="serpent" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="var(--blue-light)"/>
            <stop offset="0.3" stop-color="var(--blue)"/>
            <stop offset="0.78" stop-color="var(--blue-deep)"/>
            <stop offset="1" stop-color="var(--aqua)"/>
          </linearGradient>
          <linearGradient id="chrome" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="var(--chrome-dark)"/>
            <stop offset="0.16" stop-color="var(--white-glint)"/>
            <stop offset="0.33" stop-color="var(--chrome-mid)"/>
            <stop offset="0.5" stop-color="var(--ink)"/>
            <stop offset="0.7" stop-color="var(--chrome-light)"/>
            <stop offset="0.86" stop-color="var(--blue-light)"/>
            <stop offset="1" stop-color="var(--chrome-dark)"/>
          </linearGradient>
          <radialGradient id="bubble" cx="32%" cy="25%" r="74%">
            <stop offset="0" stop-color="var(--white-glint)" stop-opacity="0.96"/>
            <stop offset="0.2" stop-color="var(--peach)" stop-opacity="0.6"/>
            <stop offset="0.48" stop-color="var(--chrome-mid)" stop-opacity="0.38"/>
            <stop offset="0.72" stop-color="var(--blue-deep)" stop-opacity="0.58"/>
            <stop offset="0.9" stop-color="var(--paper)" stop-opacity="0.7"/>
            <stop offset="1" stop-color="var(--ink)" stop-opacity="0.75"/>
          </radialGradient>
          <radialGradient id="sun" cx="42%" cy="38%" r="62%">
            <stop offset="0" stop-color="var(--paper)"/>
            <stop offset="0.68" stop-color="var(--peach)" stop-opacity="0.8"/>
            <stop offset="1" stop-color="var(--rose)" stop-opacity="0"/>
          </radialGradient>
          <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
            <feGaussianBlur stdDeviation="24"/>
          </filter>
          <filter id="objectShadow" x="-50%" y="-50%" width="200%" height="220%">
            <feDropShadow dx="0" dy="22" stdDeviation="18" flood-color="var(--ink)" flood-opacity="0.28"/>
          </filter>
          <filter id="snakeShadow" x="-50%" y="-50%" width="200%" height="220%">
            <feDropShadow dx="10" dy="18" stdDeviation="10" flood-color="var(--blue-deep)" flood-opacity="0.38"/>
          </filter>
          <filter id="grain" x="0" y="0" width="100%" height="100%">
            <feTurbulence type="fractalNoise" baseFrequency="0.75" numOctaves="2" seed="9" result="noise"/>
            <feColorMatrix in="noise" type="saturate" values="0" result="mono"/>
            <feComponentTransfer in="mono">
              <feFuncA type="table" tableValues="0 0.055"/>
            </feComponentTransfer>
          </filter>
          <clipPath id="globeClip">
            <circle cx="1260" cy="390" r="150"/>
          </clipPath>
        </defs>

        <rect width="1600" height="1000" fill="url(#sky)"/>
        <circle cx="1190" cy="315" r="260" fill="url(#sun)" filter="url(#soft)"/>
        <ellipse cx="520" cy="548" rx="660" ry="62" fill="var(--paper)" opacity="0.2" filter="url(#soft)"/>
        <path d="M0 570 C275 530 410 596 675 558 C930 522 1235 536 1600 502 L1600 1000 L0 1000 Z" fill="url(#sand)"/>
        <path d="M0 660 C285 562 510 640 720 614 C1040 575 1270 650 1600 548 L1600 1000 L0 1000 Z" fill="url(#dune)" opacity="0.6"/>
        <path d="M0 770 C350 670 585 720 810 690 C1110 650 1345 735 1600 670" fill="none" stroke="var(--haze)" stroke-opacity="0.44" stroke-width="2"/>

        <g opacity="0.58" filter="url(#objectShadow)">
          <path d="M1315 532 C1268 433 1289 316 1380 252 C1480 181 1574 265 1600 325" fill="none" stroke="url(#chrome)" stroke-width="42" stroke-linecap="round"/>
          <path d="M1318 530 C1278 432 1299 326 1384 270 C1466 216 1540 270 1580 327" fill="none" stroke="var(--paper)" stroke-opacity="0.32" stroke-width="6" stroke-linecap="round"/>
        </g>

        <g class="bubble-cluster" filter="url(#objectShadow)">
          <circle cx="1260" cy="390" r="150" fill="url(#bubble)" stroke="var(--paper)" stroke-opacity="0.62" stroke-width="3"/>
          <g clip-path="url(#globeClip)" opacity="0.8">
            <path d="M1080 400 C1165 332 1285 320 1448 350" fill="none" stroke="var(--white-glint)" stroke-opacity="0.7" stroke-width="24"/>
            <path d="M1110 480 C1220 430 1340 444 1448 492" fill="none" stroke="var(--blue)" stroke-opacity="0.28" stroke-width="42"/>
            <ellipse cx="1215" cy="300" rx="82" ry="28" fill="var(--white-glint)" opacity="0.3" transform="rotate(-22 1215 300)"/>
          </g>
          <circle cx="1450" cy="520" r="72" fill="url(#bubble)" stroke="var(--paper)" stroke-opacity="0.58" stroke-width="2"/>
          <circle cx="1115" cy="548" r="48" fill="url(#bubble)" stroke="var(--paper)" stroke-opacity="0.6" stroke-width="2"/>
          <circle cx="1390" cy="230" r="31" fill="url(#bubble)" stroke="var(--paper)" stroke-opacity="0.62" stroke-width="2"/>
        </g>

        <g class="orbit" opacity="0.72">
          <ellipse cx="1260" cy="390" rx="222" ry="82" fill="none" stroke="var(--paper)" stroke-width="2" transform="rotate(-18 1260 390)"/>
          <circle cx="1054" cy="456" r="11" fill="var(--blue-deep)"/>
          <circle cx="1468" cy="329" r="7" fill="var(--paper)"/>
        </g>

        <ellipse cx="910" cy="858" rx="275" ry="58" fill="var(--sand-shadow)" opacity="0.35" filter="url(#soft)"/>
        <path d="M1428 720 C1282 610 1374 442 1200 416 C1026 390 1114 222 944 230 C770 238 818 474 979 487 C1135 500 1081 665 925 649 C755 632 701 774 792 852" fill="none" stroke="var(--blue-deep)" stroke-opacity="0.28" stroke-width="62" stroke-linecap="round" filter="url(#snakeShadow)"/>
        <path d="M1428 708 C1282 598 1374 430 1200 404 C1026 378 1114 210 944 218 C770 226 818 462 979 475 C1135 488 1081 653 925 637 C755 620 701 762 792 840" fill="none" stroke="url(#serpent)" stroke-width="48" stroke-linecap="round"/>
        <path class="snake-shine" d="M1428 697 C1292 589 1380 448 1196 420 C1050 398 1106 244 951 236 C840 229 824 340 874 405" fill="none" stroke="var(--white-glint)" stroke-opacity="0.65" stroke-width="6" stroke-linecap="round" stroke-dasharray="56 38"/>
        <circle cx="1419" cy="704" r="9" fill="var(--white-glint)"/>
        <circle cx="1436" cy="720" r="6" fill="var(--ink)"/>

        <g filter="url(#objectShadow)" transform="translate(625 796) rotate(-8)">
          <path d="M170 47 L50 25 L18 110 L178 87 Z" fill="url(#chrome)" stroke="var(--paper)" stroke-opacity="0.55" stroke-width="2"/>
          <ellipse cx="42" cy="67" rx="34" ry="50" fill="var(--chrome-dark)" transform="rotate(18 42 67)"/>
          <ellipse cx="39" cy="63" rx="22" ry="37" fill="url(#bubble)" transform="rotate(18 39 63)"/>
          <path d="M174 52 C226 64 260 50 290 20" fill="none" stroke="url(#chrome)" stroke-width="26" stroke-linecap="round"/>
          <path d="M180 47 C220 57 251 44 280 19" fill="none" stroke="var(--white-glint)" stroke-opacity="0.68" stroke-width="4" stroke-linecap="round"/>
          <circle cx="224" cy="48" r="9" fill="var(--paper)" stroke="var(--chrome-dark)" stroke-width="3"/>
          <circle cx="249" cy="37" r="8" fill="var(--paper)" stroke="var(--chrome-dark)" stroke-width="3"/>
        </g>

        <path d="M1360 850 C1435 806 1510 804 1600 835" fill="none" stroke="var(--paper)" stroke-opacity="0.33" stroke-width="2"/>
        <rect width="1600" height="1000" filter="url(#grain)" opacity="0.48"/>
      </svg>
    </div>

    <header class="topline">
      <p class="edition">
        <span class="mark" aria-hidden="true"></span>
        <span>Liquid Orchestra<br>Study No. 06</span>
      </p>
      <p class="status">Works forthcoming</p>
    </header>

    <main class="hero">
      <section class="title-block" aria-labelledby="page-title">
        <p class="kicker">Autonomous music in fluid form</p>
        <h1 id="page-title">
          <span>Self</span>
          <span>Driving</span>
          <span>Jazz</span>
        </h1>
      </section>

      <section class="introduction" aria-labelledby="intro-heading">
        <p class="intro-label" id="intro-heading">
          <span>Introduction</span>
          <span>Listen forward</span>
        </p>
        <p>Lorem ipsum dolor sit amet, consectetur adipiscing elit. Suspendisse vitae libero vel nunc ullamcorper feugiat, ut sonus novos cursus inveniat.</p>
      </section>
    </main>
  </div>
</body>
</html>
