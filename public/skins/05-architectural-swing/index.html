<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#e9e1cf">
  <title>Self-Driving Jazz — Architectural Swing</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Archivo+Black&family=IBM+Plex+Mono:wght@400;500&display=swap');

    :root {
      --bone: #e9e1cf;
      --paper: #f3ecdc;
      --ink: #111311;
      --navy: #172b4a;
      --cyan: #21c6cd;
      --sulfur: #d9e742;
      --rule: 1px;
      --heavy-rule: 2px;
      --s-1: .25rem;
      --s-2: .5rem;
      --s-3: .75rem;
      --s-4: 1rem;
      --s-5: 1.5rem;
      --s-6: 2rem;
      --s-7: 3rem;
      --s-8: 4rem;
      --display: "Archivo Black", "Arial Black", "Helvetica Neue", sans-serif;
      --mono: "IBM Plex Mono", "Courier New", monospace;
      color-scheme: light;
      font-synthesis: none;
    }

    * { box-sizing: border-box; }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      overflow-x: hidden;
    }

    body {
      color: var(--ink);
      background: var(--bone);
      font-family: var(--mono);
    }

    .cover {
      position: relative;
      isolation: isolate;
      width: 100%;
      min-height: 100svh;
      overflow: hidden;
      background:
        linear-gradient(90deg, transparent 49.96%, color-mix(in srgb, var(--navy) 22%, transparent) 50%, transparent 50.08%),
        linear-gradient(0deg, transparent 49.96%, color-mix(in srgb, var(--navy) 18%, transparent) 50%, transparent 50.08%),
        var(--bone);
    }

    .cover::before {
      position: absolute;
      inset: var(--s-3);
      z-index: 8;
      border: var(--rule) solid var(--ink);
      content: "";
      pointer-events: none;
    }

    .cover::after {
      position: absolute;
      top: 0;
      left: 69%;
      z-index: 0;
      width: var(--s-3);
      height: 31%;
      background: repeating-linear-gradient(
        90deg,
        var(--ink) 0 var(--rule),
        transparent var(--rule) var(--s-1)
      );
      content: "";
    }

    .folio {
      position: absolute;
      top: var(--s-5);
      left: var(--s-5);
      z-index: 9;
      display: flex;
      align-items: center;
      gap: var(--s-3);
      margin: 0;
      font-size: clamp(.54rem, .58vw, .68rem);
      font-weight: 500;
      line-height: 1;
      letter-spacing: .16em;
      text-transform: uppercase;
    }

    .folio::before {
      width: var(--s-6);
      height: var(--heavy-rule);
      background: var(--cyan);
      content: "";
    }

    .status {
      position: absolute;
      top: var(--s-5);
      right: var(--s-5);
      z-index: 9;
      display: grid;
      grid-template-columns: auto auto;
      align-items: center;
      gap: var(--s-2);
      margin: 0;
      font-size: clamp(.52rem, .56vw, .66rem);
      letter-spacing: .12em;
      line-height: 1;
      text-transform: uppercase;
    }

    .status::before {
      width: var(--s-2);
      aspect-ratio: 1;
      border: var(--rule) solid var(--ink);
      background: var(--sulfur);
      content: "";
    }

    h1 {
      margin: 0;
      font-family: var(--display);
      font-weight: 900;
      line-height: .73;
      letter-spacing: -.085em;
      text-transform: uppercase;
    }

    h1 span {
      position: absolute;
      z-index: 1;
      display: block;
      white-space: nowrap;
    }

    .word-self {
      top: 10%;
      left: 2.1%;
      color: var(--ink);
      font-size: clamp(5rem, 13.5vw, 14rem);
    }

    .word-driving {
      top: 29%;
      left: -1.2%;
      color: transparent;
      -webkit-text-stroke: clamp(.07rem, .13vw, .14rem) var(--navy);
      font-size: clamp(4.7rem, 12.7vw, 13rem);
    }

    .word-jazz {
      right: 1.2%;
      bottom: -1.7%;
      color: var(--navy);
      font-size: clamp(8.5rem, 22.5vw, 23rem);
    }

    .word-jazz::before {
      position: absolute;
      top: 13%;
      left: -7%;
      width: 15%;
      height: 72%;
      background: var(--cyan);
      mix-blend-mode: multiply;
      content: "";
    }

    .instrument {
      position: absolute;
      top: 5.5%;
      left: 26%;
      z-index: 4;
      width: min(71vw, 67rem);
      height: 86%;
      animation: calibrate 9s cubic-bezier(.22, 1, .36, 1) infinite alternate;
    }

    .instrument svg {
      display: block;
      width: 100%;
      height: 100%;
      overflow: visible;
    }

    .intro {
      position: absolute;
      bottom: var(--s-5);
      left: var(--s-5);
      z-index: 7;
      width: min(25rem, 31vw);
      margin: 0;
      padding: var(--s-3) var(--s-4) var(--s-3) 0;
      border-top: var(--heavy-rule) solid var(--ink);
      background: color-mix(in srgb, var(--bone) 91%, transparent);
      font-size: clamp(.6rem, .68vw, .74rem);
      line-height: 1.55;
    }

    .intro strong {
      display: block;
      margin-bottom: var(--s-2);
      color: var(--navy);
      font-size: .83em;
      font-weight: 500;
      letter-spacing: .18em;
      text-transform: uppercase;
    }

    .axis-label {
      position: absolute;
      z-index: 6;
      margin: 0;
      color: var(--navy);
      font-size: .53rem;
      letter-spacing: .14em;
      text-transform: uppercase;
    }

    .axis-label--west {
      top: 57%;
      left: calc(var(--s-3) + var(--s-1));
      writing-mode: vertical-rl;
      transform: rotate(180deg);
    }

    .axis-label--east {
      right: calc(var(--s-3) + var(--s-1));
      bottom: 25%;
      writing-mode: vertical-rl;
    }

    .registration {
      position: absolute;
      right: 17%;
      bottom: 9%;
      z-index: 6;
      width: var(--s-6);
      aspect-ratio: 1;
      border: var(--rule) solid var(--ink);
      border-radius: 50%;
    }

    .registration::before,
    .registration::after {
      position: absolute;
      background: var(--ink);
      content: "";
    }

    .registration::before {
      top: 50%;
      left: calc(-1 * var(--s-2));
      width: calc(100% + var(--s-4));
      height: var(--rule);
    }

    .registration::after {
      top: calc(-1 * var(--s-2));
      left: 50%;
      width: var(--rule);
      height: calc(100% + var(--s-4));
    }

    @keyframes calibrate {
      from { transform: translate3d(0, 0, 0); }
      to { transform: translate3d(0, calc(-1 * var(--s-2)), 0); }
    }

    @media (max-width: 720px) {
      .cover {
        min-height: 48rem;
        background:
          linear-gradient(90deg, transparent 27.9%, color-mix(in srgb, var(--navy) 20%, transparent) 28%, transparent 28.2%),
          var(--bone);
      }

      .cover::before { inset: var(--s-2); }
      .cover::after { left: 84%; height: 18%; }

      .folio {
        top: var(--s-4);
        left: var(--s-4);
        max-width: 50%;
        align-items: flex-start;
        line-height: 1.35;
      }

      .folio::before { width: var(--s-5); margin-top: .35em; flex: 0 0 auto; }

      .status {
        top: var(--s-4);
        right: var(--s-4);
        grid-template-columns: auto;
        justify-items: end;
        max-width: 33%;
        line-height: 1.35;
        text-align: right;
      }

      .status::before { grid-row: 2; }

      .word-self {
        top: 12%;
        left: 2%;
        font-size: 24vw;
      }

      .word-driving {
        top: 26%;
        right: 1%;
        left: auto;
        font-size: 16.5vw;
        letter-spacing: -.1em;
        writing-mode: vertical-rl;
      }

      .word-jazz {
        right: auto;
        bottom: 12.5%;
        left: -1.7%;
        font-size: 32.5vw;
      }

      .word-jazz::before {
        top: -13%;
        left: 8%;
        width: 62%;
        height: 13%;
      }

      .instrument {
        top: 17%;
        left: -15%;
        width: 116%;
        height: 61%;
      }

      .intro {
        bottom: var(--s-4);
        left: var(--s-4);
        width: calc(100% - var(--s-8));
        max-width: 23rem;
        padding-right: 0;
        font-size: .64rem;
      }

      .axis-label--west { top: 49%; left: calc(var(--s-2) + var(--s-1)); }
      .axis-label--east { display: none; }
      .registration { right: var(--s-5); bottom: 19%; }
    }

    @media (max-width: 380px) {
      .cover { min-height: 45rem; }
      .instrument { top: 19%; left: -23%; width: 126%; height: 57%; }
      .word-self { top: 13%; }
      .word-driving { top: 27%; }
      .word-jazz { bottom: 14%; }
      .intro { width: calc(100% - var(--s-7)); }
    }

    @media (min-width: 721px) and (max-height: 650px) {
      .instrument { top: 2%; height: 83%; }
      .intro { bottom: var(--s-4); }
      .word-jazz { font-size: 19vw; }
    }

    @media (prefers-reduced-motion: reduce) {
      .instrument { animation: none; }
    }
  </style>
</head>
<body>
